name: Release

# Real releases only run on the public mirror repo (eightHundreds/iskills).
# Tag flow: tag v* on private → sync-public pushes tag here → this workflow publishes.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.repository == 'eightHundreds/iskills'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: pnpm run type-check
      - run: pnpm run build
      - run: pnpm pack --dry-run
      - run: npm publish
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
