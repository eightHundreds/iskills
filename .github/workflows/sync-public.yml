name: Sync public

# Push a filtered tree from iskills-private → eightHundreds/iskills.
# Private-only paths (never appear on public):
#   - test/
#   - docs/
#   - AGENTS.md
#   - CONTEXT.md
#
# Auth (either secret works):
#   - PUBLIC_REPO_SSH_KEY: write deploy key private key for eightHundreds/iskills
#   - PUBLIC_REPO_TOKEN: PAT with Contents write on eightHundreds/iskills
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-public
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'eightHundreds/iskills-private'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require sync credentials
        env:
          PUBLIC_REPO_SSH_KEY: ${{ secrets.PUBLIC_REPO_SSH_KEY }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "${PUBLIC_REPO_SSH_KEY:-}" ] && [ -z "${PUBLIC_REPO_TOKEN:-}" ]; then
            echo '::error::Set PUBLIC_REPO_SSH_KEY (deploy key) or PUBLIC_REPO_TOKEN (PAT) on iskills-private'
            exit 1
          fi

      - name: Build filtered tree and push to public
        env:
          PUBLIC_REPO_SSH_KEY: ${{ secrets.PUBLIC_REPO_SSH_KEY }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          set -euo pipefail

          PRIVATE_SHA=$(git rev-parse HEAD)
          REF_NAME="${GITHUB_REF_NAME}"
          IS_TAG=false
          case "${GITHUB_REF}" in
            refs/tags/*) IS_TAG=true ;;
          esac

          SRC="${GITHUB_WORKSPACE}"
          FILTERED=$(mktemp -d)
          PUBLIC=$(mktemp -d)

          rsync -a \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'tmp/' \
            --exclude '.DS_Store' \
            --exclude '.scratch/' \
            "${SRC}/" "${FILTERED}/"

          rm -rf \
            "${FILTERED}/test" \
            "${FILTERED}/docs" \
            "${FILTERED}/AGENTS.md" \
            "${FILTERED}/CONTEXT.md"

          if [ -n "${PUBLIC_REPO_SSH_KEY:-}" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "$PUBLIC_REPO_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
            CLONE_URL="git@github.com:eightHundreds/iskills.git"
          else
            CLONE_URL="https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/eightHundreds/iskills.git"
          fi

          git clone --depth 1 "${CLONE_URL}" "${PUBLIC}"

          cd "${PUBLIC}"
          git config user.name 'iskills-sync[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a "${FILTERED}/" .

          git add -A
          if git diff --cached --quiet; then
            echo 'No file changes vs public main'
          else
            git commit -m "sync: from private ${PRIVATE_SHA:0:7}"
          fi

          git push origin HEAD:main

          if [ "${IS_TAG}" = true ]; then
            git tag -f "${REF_NAME}"
            git push origin "refs/tags/${REF_NAME}" --force
            echo "Pushed tag ${REF_NAME} → public (triggers Release on iskills)"
          fi
