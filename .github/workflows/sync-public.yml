name: Sync public

# Replay private main (first-parent) onto eightHundreds/iskills:
#   - drop private-only paths (see PRIVATE_ONLY_PATHS in scripts/sync-to-public.sh):
#     test/, docs/, AGENTS.md, CONTEXT.md, .grok/, .impeccable/, PRODUCT.md, DESIGN.md
#   - keep other files, commit message, author, committer, and timestamps
#   - skip commits that only touch private-only paths
#
# Auth (either secret works):
#   - PUBLIC_REPO_SSH_KEY: write deploy key private key for eightHundreds/iskills
#   - PUBLIC_REPO_TOKEN: PAT with Contents write on eightHundreds/iskills
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Rewrite full public history from private main'
        required: false
        default: false
        type: boolean

# contents:write — push refs/sync/last-private on this repo after a successful export
permissions:
  contents: write

concurrency:
  group: sync-public
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'eightHundreds/iskills-private'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch sync bookmark ref
        run: git fetch origin '+refs/sync/*:refs/sync/*' || true

      - name: Require sync credentials
        env:
          PUBLIC_REPO_SSH_KEY: ${{ secrets.PUBLIC_REPO_SSH_KEY }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "${PUBLIC_REPO_SSH_KEY:-}" ] && [ -z "${PUBLIC_REPO_TOKEN:-}" ]; then
            echo '::error::Set PUBLIC_REPO_SSH_KEY (deploy key) or PUBLIC_REPO_TOKEN (PAT) on iskills-private'
            exit 1
          fi

      - name: Replay filtered history to public
        env:
          PUBLIC_REPO_SSH_KEY: ${{ secrets.PUBLIC_REPO_SSH_KEY }}
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x scripts/sync-to-public.sh
          extra=()
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ] && [ '${{ inputs.force_rebuild }}' = 'true' ]; then
            extra+=(--force-rebuild)
          fi
          # First successful export (no refs/sync/last-private) also does a full rebuild.
          ./scripts/sync-to-public.sh "${extra[@]+"${extra[@]}"}"
