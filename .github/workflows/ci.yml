name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # OpenTUI native Zig core loads under Bun (Node lacks node:ffi on stock 24.x).
      # UI frame tests and interactive bin re-exec require Bun on PATH.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: git config --global init.defaultBranch main
      - run: env -u CI ISKILLS_DISABLE_MOUSE=1 pnpm test
      - run: pnpm pack --dry-run
