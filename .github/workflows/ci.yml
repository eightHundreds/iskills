name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Private SoT: full test suite (requires test/ which is not synced publicly).
  test:
    if: github.repository == 'eightHundreds/iskills-private'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      # OpenTUI native Zig core loads under Bun (stock Node lacks node:ffi).
      # UI frame tests and interactive bin re-exec require Bun on PATH.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: pnpm install --frozen-lockfile
      - run: git config --global init.defaultBranch main
      - run: env -u CI ISKILLS_DISABLE_MOUSE=1 pnpm test
      - run: pnpm pack --dry-run

  # Public mirror: no private test/docs tree; verify build + package shape only.
  check:
    if: github.repository == 'eightHundreds/iskills'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run type-check
      - run: pnpm run build
      - run: pnpm pack --dry-run
